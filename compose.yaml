services:
  clara:
    build: .
    container_name: clara-nutrimenu
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.4}
      CHAT_DB_PATH: /app/storage/chats.db
      LANCEDB_DIR: /app/storage/lancedb
    volumes:
      - clara_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clara_storage:
